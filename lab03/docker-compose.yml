services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set it in .env}
      POSTGRES_DB: ${PG_DB:-selab3}
    ports:
      - "127.0.0.1:${PG_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-selab3}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
